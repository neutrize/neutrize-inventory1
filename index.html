<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEUTRIZE 給与計算</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g:#B8965A;--gp:#F5ECD9;--gd:rgba(184,150,90,.12);--dk:#2C2C2A;--g1:#F1EFE8;--g2:#888780;--bd:rgba(0,0,0,.09);--bg:#F4F2EE;--cd:#fff;--tx:#1A1A18;--t2:#5F5E5A;--t3:#999892;--rd:#A32D2D}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);padding:20px 12px 60px}
.app{max-width:680px;margin:0 auto}

/* header */
.hdr{background:var(--dk);border-radius:14px 14px 0 0;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--g);letter-spacing:.12em}
.logo-s{font-size:10px;color:var(--g2);margin-top:2px}
.pill{font-size:11px;color:var(--g);background:var(--gd);border:0.5px solid rgba(184,150,90,.3);border-radius:20px;padding:4px 12px}

/* panels */
.pnl{background:var(--cd);border:0.5px solid var(--bd);border-top:none;padding:12px 16px}
.row{display:flex;align-items:center;gap:8px}
.lbl{font-size:11px;color:var(--t2);white-space:nowrap;flex-shrink:0}
.iw{position:relative;flex:1}
.iw input{width:100%;height:30px;padding:0 28px 0 10px;border:0.5px solid rgba(0,0,0,.13);border-radius:7px;font-size:11px;font-family:monospace;color:var(--tx);background:#FAFAF8}
.iw input:focus{outline:none;border-color:var(--g)}
.eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:12px;color:var(--t3)}
.ast{font-size:10px;white-space:nowrap}.ast.ok{color:var(--g)}.ast.ng{color:var(--rd)}

/* upload */
.uz{border:0.5px dashed rgba(0,0,0,.18);border-radius:12px;padding:14px;text-align:center;cursor:pointer;position:relative;overflow:hidden;transition:background .15s;margin-bottom:10px}
.uz:hover{background:var(--g1)}
.uz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.ut{font-size:12px;font-weight:500;color:var(--tx)}.us{font-size:10px;color:var(--t2)}
.pw{display:none;flex-direction:column;align-items:center;gap:4px}
.pw img{max-height:55px;border-radius:7px;object-fit:contain;max-width:100%}
.pfi{font-size:10px;color:var(--t3)}.pi2{font-size:9px;color:var(--g)}

/* buttons */
.sbtn,.pbtn{height:38px;border:none;border-radius:9px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s}
.sbtn{width:100%;background:var(--g);color:#fff;margin-bottom:8px}
.sbtn:disabled{opacity:.32;cursor:not-allowed}.sbtn:hover:not(:disabled){opacity:.85}
.pbtn{background:var(--dk);color:var(--g);padding:0 20px;border:0.5px solid rgba(184,150,90,.4)}
.pbtn:hover{opacity:.85}
.btn-row{display:flex;gap:8px;margin-top:10px}

/* progress */
.pgw{display:none;margin-bottom:6px}
.pgb{height:4px;background:var(--g1);border-radius:2px;overflow:hidden}
.pgf{height:100%;background:var(--g);border-radius:2px;transition:width .4s;width:0}
.pgl{font-size:10px;color:var(--t3);text-align:center;margin-top:3px}
.sl{font-size:11px;text-align:center;min-height:14px;color:var(--t2)}
.sl.err{color:var(--rd)}.sl.ok{color:var(--g)}
.dbg{display:none;background:var(--g1);border-radius:7px;padding:6px 9px;font-size:10px;color:var(--t2);font-family:monospace;word-break:break-all;line-height:1.5;margin-top:5px;max-height:70px;overflow-y:auto}

/* section */
.stl{font-size:10px;font-weight:500;color:var(--t3);letter-spacing:.1em;padding:12px 0 5px}

/* staff card */
.sc{background:var(--cd);border:0.5px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden}
.sc .hd{background:var(--dk);padding:10px 16px;display:flex;align-items:center;gap:10px}
.sc.as .hd{background:#3D3C38}
.av{width:3px;height:28px;background:var(--g);border-radius:2px;flex-shrink:0;opacity:.7}
.nk{font-size:13px;font-weight:500;color:#fff}
.bg{font-size:9px;color:#633806;background:#FAEEDA;border-radius:10px;padding:1px 7px;border:0.5px solid #EF9F27;margin-left:4px}
.td{margin-left:auto;text-align:right}
.tl2{font-size:9px;color:var(--g2)}
.tv{font-size:16px;font-weight:600;color:var(--g);font-family:'Cormorant Garamond',serif;line-height:1.1}

.bd{padding:14px 16px}

/* edit toggle */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sec-name{font-size:13px;font-weight:500;color:var(--tx)}
.eb{font-size:10px;color:var(--t3);background:none;border:0.5px solid var(--bd);border-radius:5px;padding:3px 10px;cursor:pointer;transition:all .12s}
.eb:hover,.eb.op{color:var(--g);border-color:var(--g)}.eb.op{background:var(--gd)}

/* fixed panel */
.fp{display:none;margin-bottom:12px}
.fp.op{display:block}
.fp-title{font-size:9px;color:var(--t3);letter-spacing:.08em;margin-bottom:6px;padding-bottom:4px;border-bottom:0.5px solid var(--bd)}

/* grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.fi{} 
.fi label{display:block;font-size:9px;color:var(--t3);letter-spacing:.05em;margin-bottom:3px;font-weight:500}
.fi.full{grid-column:1/-1}

.nw{position:relative}
.nw input{width:100%;height:32px;padding:0 8px 0 20px;border:0.5px solid rgba(0,0,0,.12);border-radius:7px;font-size:12px;font-family:inherit;color:var(--tx);background:var(--cd)}
.nw input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 2px rgba(184,150,90,.12)}
.nw input.oc{background:var(--gp);border-color:rgba(184,150,90,.3)}
.nw .yn{position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--t3);pointer-events:none}

/* divider */
.div{border:none;border-top:0.5px dashed var(--bd);margin:10px 0}

/* breakdown table */
.bk-title{font-size:10px;font-weight:500;color:var(--t2);margin-bottom:6px;letter-spacing:.06em}
.bk-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
.bk-table td{padding:4px 6px;border-bottom:0.5px solid var(--bd);color:var(--t2)}
.bk-table td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--tx)}
.bk-table tr.zero td{color:var(--t3)}
.bk-table tr.bold td{font-weight:700;color:var(--tx);background:var(--g1)}
.bk-table tr.gold td{font-weight:700;color:var(--g);font-size:12px;border-bottom:none}
.bk-table .tag{font-size:8px;color:var(--g);background:var(--gd);border-radius:4px;padding:1px 5px;margin-left:4px}
.bk-table .tag.var{color:#2C6B1F;background:#E8F5E2}

/* commission */
.hb{display:flex;justify-content:space-between;align-items:center;background:var(--gp);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.hb-l{font-size:10px;color:#633806}
.hb-v{font-size:18px;font-weight:600;color:var(--g)}
.hb-v small{font-size:10px;font-weight:400;margin-left:2px;color:var(--t2)}
.tier-row{display:flex;justify-content:space-between;font-size:10px;padding:1.5px 0;color:var(--t2)}
.tier-row.dm{color:var(--t3)}
.tier-row .tv2{font-variant-numeric:tabular-nums}

/* grand */
.gb{background:var(--dk);border-radius:0 0 14px 14px;padding:14px 20px}
.gb-inner{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.gb-lbl{font-size:11px;color:var(--g2)}
.gb-val{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--g)}
.gb-val small{font-size:12px;margin-left:2px;color:var(--g2);font-family:inherit;font-weight:400}
.gb-breakdown{display:flex;gap:16px;flex-wrap:wrap}
.gb-item{font-size:10px;color:var(--g2)}
.gb-item span{color:var(--g);font-weight:500}



/* tabs */
.tab-nav{display:flex;justify-content:flex-end;gap:4px;padding:10px 16px 0;background:var(--bg)}
.tab-btn{padding:4px 14px;font-size:10px;font-family:inherit;color:var(--t3);background:var(--cd);border:0.5px solid var(--bd);border-radius:20px;cursor:pointer;transition:all .15s;letter-spacing:.06em}
.tab-btn.on{color:var(--g);border-color:rgba(184,150,90,.4);background:var(--gp)}
.tab-pane{display:none}.tab-pane.on{display:block}

/* history */
.hist-bar{background:var(--cd);border:0.5px solid var(--bd);border-top:none;padding:14px 16px}
.hist-empty{text-align:center;padding:40px 0;font-size:12px;color:var(--t3)}
.save-btn{width:100%;height:38px;background:var(--dk);color:var(--g);border:0.5px solid rgba(184,150,90,.3);border-radius:9px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px;transition:opacity .15s}
.save-btn:hover{opacity:.85}
.hist-month{margin-bottom:20px}
.hist-month-label{font-size:11px;font-weight:500;color:var(--t2);letter-spacing:.08em;margin-bottom:8px;padding-bottom:4px;border-bottom:0.5px solid var(--bd)}
.hist-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:8px}
.hist-table td{padding:5px 8px;border-bottom:0.5px solid var(--bd);color:var(--t2)}
.hist-table td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--tx);font-weight:500}
.hist-table tr.total td{font-weight:700;color:var(--tx);background:var(--g1);font-size:12px}
.hist-del{font-size:10px;color:var(--t3);background:none;border:none;cursor:pointer;float:right;margin-top:-2px}
.hist-del:hover{color:var(--rd)}
.chart-wrap{background:var(--g1);border-radius:10px;padding:12px;margin-bottom:16px}
.chart-title{font-size:10px;color:var(--t2);letter-spacing:.08em;margin-bottom:10px}
canvas{width:100%;height:160px;display:block}

/* passcode */
.pc-overlay{position:fixed;inset:0;background:#2C2C2A;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:0}
.pc-overlay.hide{display:none}
.pc-logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;color:#B8965A;letter-spacing:.14em;margin-bottom:6px}
.pc-sub{font-size:10px;color:#888780;letter-spacing:.12em;margin-bottom:40px}
.pc-dots{display:flex;gap:12px;margin-bottom:32px}
.pc-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(184,150,90,.4);background:transparent;transition:background .15s}
.pc-dot.on{background:#B8965A;border-color:#B8965A}
.pc-pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.pc-key{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.1);color:#fff;font-size:22px;font-family:inherit;cursor:pointer;transition:background .12s;display:flex;align-items:center;justify-content:center}
.pc-key:hover{background:rgba(184,150,90,.18)}
.pc-key:active{background:rgba(184,150,90,.35)}
.pc-key.del{font-size:16px;color:#888780}
.pc-key.empty{background:transparent;border:none;cursor:default}
.pc-err{font-size:11px;color:#A32D2D;margin-top:16px;min-height:16px;letter-spacing:.06em}
</style>
</head>
<body>
<div class="pc-overlay" id="pcOverlay">
  <div class="pc-logo">NEUTRIZE</div>
  <div class="pc-sub">給与計算</div>
  <div class="pc-dots" id="pcDots">
    <div class="pc-dot" id="d0"></div>
    <div class="pc-dot" id="d1"></div>
    <div class="pc-dot" id="d2"></div>
    <div class="pc-dot" id="d3"></div>
  </div>
  <div class="pc-pad">
    <button class="pc-key" onclick="pcInput('1')">1</button>
    <button class="pc-key" onclick="pcInput('2')">2</button>
    <button class="pc-key" onclick="pcInput('3')">3</button>
    <button class="pc-key" onclick="pcInput('4')">4</button>
    <button class="pc-key" onclick="pcInput('5')">5</button>
    <button class="pc-key" onclick="pcInput('6')">6</button>
    <button class="pc-key" onclick="pcInput('7')">7</button>
    <button class="pc-key" onclick="pcInput('8')">8</button>
    <button class="pc-key" onclick="pcInput('9')">9</button>
    <button class="pc-key empty"></button>
    <button class="pc-key" onclick="pcInput('0')">0</button>
    <button class="pc-key del" onclick="pcDel()">⌫</button>
  </div>
  <div class="pc-err" id="pcErr"></div>
</div>
<div class="app">

<!-- TAB NAV -->
<div class="tab-nav">
  <button class="tab-btn on" onclick="switchTab('calc')">給与計算</button>
  <button class="tab-btn" onclick="switchTab('hist')">履歴・グラフ</button>
</div>

<div class="tab-pane on" id="tab-calc">
<!-- HEADER -->
<div class="hdr">
  <div><div class="logo">NEUTRIZE</div><div class="logo-s">給与計算</div></div>
  <div class="pill" id="mp"></div>
</div>

<!-- API KEY -->
<div class="pnl no-print">
  <div class="row">
    <div class="lbl">🔑 APIキー</div>
    <div class="iw"><input type="password" id="ak" placeholder="sk-ant-api03-..." oninput="onAk()"><button class="eye" onclick="tEye()">👁</button></div>
    <div class="ast ng" id="aSt">未設定</div>
  </div>
</div>

<!-- SCAN -->
<div class="pnl no-print">
  <div class="uz" onclick="document.getElementById('fi').click()">
    <input type="file" id="fi" accept="image/*" onchange="onF(event)">
    <div id="ud"><div style="font-size:20px;color:var(--g);margin-bottom:4px">⬆</div><div class="ut">HPBスクリーンショットをアップロード</div><div class="us">スタイリスト4名の指名技術売上を一括読み取り</div></div>
    <div class="pw" id="upP"><img id="uImg" src="" alt=""><div class="pfi" id="uFn"></div><div class="pi2" id="uInfo"></div></div>
  </div>
  <button class="sbtn" id="sb" onclick="doOCR()" disabled>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    スタイリスト4名の指名技術売上を一括スキャン
  </button>
  <div class="pgw" id="pgw"><div class="pgb"><div class="pgf" id="pgf"></div></div><div class="pgl" id="pgl"></div></div>
  <div class="sl" id="sl"></div>
  <div class="dbg" id="dg"></div>
  <div class="btn-row">
    <button class="pbtn" onclick="doPDF()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      PDF出力
    </button>
  </div>
</div>

<div class="stl">— スタイリスト</div>
<div id="ss"></div>
<div class="stl">— アシスタント</div>
<div id="as2"></div>

<!-- GRAND TOTAL -->
<div class="gb">
  <div class="gb-inner">
    <div class="gb-lbl">全員合計支給額</div>
    <div class="gb-val" id="gt">— <small>円</small></div>
  </div>
  <div class="gb-breakdown" id="gt-bd"></div>
</div>


</div><!-- /tab-calc -->

<div class="tab-pane" id="tab-hist">
  <div class="hdr" style="border-radius:0">
    <div><div class="logo">NEUTRIZE</div><div class="logo-s">履歴・グラフ</div></div>
    <div class="pill" id="mp2"></div>
  </div>
  <div class="hist-bar">
    <div style="display:flex;gap:8px;margin-bottom:14px">
    <button class="save-btn" style="margin-bottom:0;flex:1" onclick="saveMonth()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      今月の給与データを履歴に保存
    </button>
    <button onclick="clearAllHist()" style="height:38px;padding:0 14px;background:none;border:0.5px solid rgba(163,45,45,.3);border-radius:9px;font-size:11px;color:var(--rd);cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0" title="全履歴を削除">全削除</button>
  </div>
    <div class="chart-wrap" id="chartWrap" style="display:none">
      <div class="chart-title">全員合計歩合 推移</div>
      <canvas id="myChart"></canvas>
    </div>
    <div id="histList"><div class="hist-empty">まだ履歴がありません。<br>給与計算後に「保存」ボタンを押してください。</div></div>
  </div>
</div><!-- /tab-hist -->

</div><!-- /app -->

<script>

/* ── PASSCODE ── */
const PC_CODE = '0603'; // ← ここを変更
let pcBuf = '';
function pcInput(n){
  if(pcBuf.length>=4) return;
  pcBuf += n;
  document.getElementById('d'+(pcBuf.length-1)).classList.add('on');
  if(pcBuf.length===4){
    setTimeout(()=>{
      if(pcBuf===PC_CODE){
        document.getElementById('pcOverlay').classList.add('hide');
      } else {
        document.getElementById('pcErr').textContent='パスコードが違います';
        pcBuf='';
        [0,1,2,3].forEach(i=>document.getElementById('d'+i).classList.remove('on'));
        setTimeout(()=>document.getElementById('pcErr').textContent='',1200);
      }
    },120);
  }
}
function pcDel(){
  if(!pcBuf.length) return;
  pcBuf=pcBuf.slice(0,-1);
  [0,1,2,3].forEach(i=>document.getElementById('d'+i).classList.toggle('on',i<pcBuf.length));
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('pcOverlay').classList.contains('hide')) return;
  if(e.key>='0'&&e.key<='9') pcInput(e.key);
  if(e.key==='Backspace') pcDel();
});

const now=new Date();
document.getElementById('mp').textContent=now.getFullYear()+'年'+(now.getMonth()+1)+'月';

const ST=[
  {id:'oshima', n:'大島',fn:'大島香純',bg:'110万〜',b:300000,y:0,tk:0,ju:12300,ko:0,
   ti:[{lo:1100000,hi:Infinity,un:10000}]},
  {id:'ujihira',n:'氏平',fn:'氏平実里',bg:null,b:230000,y:0,tk:0,ju:0,ko:9200,
   ti:[{lo:600000,hi:800000,un:5000},{lo:800000,hi:1000000,un:7500},{lo:1000000,hi:Infinity,un:10000}]},
  {id:'ishii',  n:'石井',fn:'石井渚',  bg:null,b:220000,y:0,tk:10000,ju:0,ko:11460,
   ti:[{lo:600000,hi:800000,un:5000},{lo:800000,hi:1000000,un:7500},{lo:1000000,hi:Infinity,un:10000}]},
  {id:'kondo',  n:'近藤',fn:'近藤千寿',bg:null,b:225000,y:0,tk:0,ju:0,ko:18700,
   ti:[{lo:600000,hi:800000,un:5000},{lo:800000,hi:1000000,un:7500},{lo:1000000,hi:Infinity,un:10000}]},
];
const AS=[
  {id:'akiho',  n:'秋保',fn:'秋保まこ', bg:null,b:180000,y:0,tk:0,ju:10400,ko:0,ti:null},
  {id:'kasai',  n:'笠井',fn:'笠井涼花', bg:null,b:180000,y:0,tk:0,ju:0,ko:13500,ti:null},
  {id:'okazaki',n:'岡崎',fn:'岡崎颯太', bg:null,b:34100,y:0,tk:0,ju:0,ko:0,ti:null},
];
const ALL=[...ST,...AS],PM={};ALL.forEach(p=>{PM[p.id]=p;});
const TL={1100000:'110万〜',600000:'60〜80万',800000:'80〜100万',1000000:'100万〜'};
const fmt=n=>Math.round(n).toLocaleString('ja-JP');
const nv=id=>parseInt(document.getElementById(id)?.value)||0;

function hoba(s,ti){
  if(!ti||!s)return{t:0,rows:[]};
  let t=0;
  const rows=ti.map(x=>{
    if(s<=x.lo)return{l:TL[x.lo]||'',s:0,on:false};
    const cap=x.hi===Infinity?s:Math.min(s,x.hi),st2=Math.floor((cap-x.lo)/50000),sub=st2*x.un;t+=sub;
    return{l:TL[x.lo]||'',s:sub,on:st2>0};
  });
  return{t,rows};
}

function upP(p){
  const b=nv('b-'+p.id),y=nv('y-'+p.id),tk=nv('tk-'+p.id),ju=nv('ju-'+p.id),ko=nv('ko-'+p.id);
  const uri=nv('uri-'+p.id),gijutsu=nv('gijutsu-'+p.id),shutcho=nv('shutcho-'+p.id);
  let h=0,tRows=[];
  if(p.ti){const r=hoba(nv('sh-'+p.id),p.ti);h=r.t;tRows=r.rows;}
  const total=b+y+tk+ju+ko+uri+gijutsu+shutcho+h;
  document.getElementById('pt-'+p.id).innerHTML='¥'+fmt(total);

  // breakdown
  const fields=[
    {k:'基本給',v:b,fixed:true},{k:'役付手当',v:y,fixed:true},{k:'特別手当',v:tk,fixed:true},
    {k:'住宅手当',v:ju,fixed:true},{k:'交通費',v:ko,fixed:true},
    {k:'売上達成手当',v:uri,fixed:false},{k:'技術手当',v:gijutsu,fixed:false},{k:'出張手当',v:shutcho,fixed:false},
  ];
  if(p.ti){
    fields.push({k:'指名技術売上',v:nv('sh-'+p.id),fixed:false,info:true});
    fields.push({k:'歩合',v:h,fixed:false,hoba:true});
  }
  let bkHTML='<table class="bk-table">';
  fields.forEach(f=>{
    if(f.info)return;
    const zero=f.v===0?'zero':'';
    const tag=f.fixed?'<span class="tag">固定</span>':'<span class="tag var">変動</span>';
    const hTag=f.hoba?'<span class="tag">歩合</span>':'';
    bkHTML+=`<tr class="${zero}"><td>${f.k}${tag}${hTag}</td><td>${f.v>0?'¥'+fmt(f.v):'—'}</td></tr>`;
  });
  if(p.ti&&tRows.length){
    tRows.forEach(r=>{if(r.on)bkHTML+=`<tr><td style="padding-left:16px;font-size:10px;color:var(--t3)">└ ${r.l}</td><td style="font-size:10px;color:var(--t3)">¥${fmt(r.s)}</td></tr>`;});
  }
  bkHTML+=`<tr class="gold"><td>支給合計</td><td>¥${fmt(total)}</td></tr></table>`;

  let hobaHTML='';
  if(p.ti){
    const sh=nv('sh-'+p.id);
    hobaHTML=`<div class="hb"><div><div class="hb-l">歩合（指名技術売上 ¥${fmt(sh)}）</div><div style="margin-top:3px">${tRows.map(r=>`<div class="tier-row ${r.on?'':'dm'}"><span>${r.l}</span><span class="tv2">${r.s>0?'¥'+fmt(r.s):'—'}</span></div>`).join('')}</div></div><div class="hb-v">¥${fmt(h)}<small>円</small></div></div>`;
  }
  document.getElementById('bk-'+p.id).innerHTML=bkHTML;
  if(p.ti) document.getElementById('hb-'+p.id).innerHTML=hobaHTML;
  upG();
}

  const items=ALL.map(p=>{
    const b=nv('b-'+p.id),y=nv('y-'+p.id),tk=nv('tk-'+p.id),ju=nv('ju-'+p.id),ko=nv('ko-'+p.id);
    const uri=nv('uri-'+p.id),g2=nv('gijutsu-'+p.id),sc2=nv('shutcho-'+p.id);
    let h=0;if(p.ti)h=hoba(nv('sh-'+p.id),p.ti).t;
    return{n:p.n,t:b+y+tk+ju+ko+uri+g2+sc2+h};

}

let cb64=null,fr=false;

function cImg(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height,mx=1200;
        if(w>mx){h=Math.round(h*mx/w);w=mx;}if(h>mx){w=Math.round(w*mx/h);h=mx;}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        const du=c.toDataURL('image/jpeg',0.82),b64=du.split(',')[1];
        res({b64,kb:Math.round(b64.length*3/4/1024),w,h});
      };img.src=ev.target.result;
    };r.readAsDataURL(file);
  });
}
async function onF(e){
  const f=e.target.files[0];if(!f)return;setSl('圧縮中...','');
  try{
    const{b64,kb,w,h}=await cImg(f);cb64=b64;
    document.getElementById('uImg').src='data:image/jpeg;base64,'+b64;
    document.getElementById('uFn').textContent=f.name;
    document.getElementById('uInfo').textContent=`圧縮: ${Math.round(f.size/1024)}KB → ${kb}KB (${w}×${h}px)`;
    document.getElementById('ud').style.display='none';document.getElementById('upP').style.display='flex';
    fr=true;uSB();setSl('スキャンボタンを押してください。','');
  }catch(e){setSl('読み込みエラー','err');}
}

/* ── HISTORY ── */
const HKEY='nr_hist_v1';
function loadHist(){try{return JSON.parse(localStorage.getItem(HKEY)||'[]');}catch(e){return[];}}
function saveHist(d){try{localStorage.setItem(HKEY,JSON.stringify(d));}catch(e){}}

function saveMonth(){
  const label=document.getElementById('mp').textContent;
  const entries=ALL.map(p=>{
    const b=nv('b-'+p.id),y=nv('y-'+p.id),tk=nv('tk-'+p.id),ju=nv('ju-'+p.id),ko=nv('ko-'+p.id);
    const uri=nv('uri-'+p.id),gijutsu=nv('gijutsu-'+p.id),shutcho=nv('shutcho-'+p.id);
    let h=0;if(p.ti)h=hoba(nv('sh-'+p.id),p.ti).t;
    return{name:p.fn,total:b+y+tk+ju+ko+uri+gijutsu+shutcho+h,hoba:h};
  });
  const grand=entries.reduce((s,e)=>s+e.total,0);
  const hist=loadHist();
  const existing=hist.findIndex(x=>x.label===label);
  const rec={label,entries,grand,savedAt:new Date().toLocaleString('ja-JP')};
  if(existing>=0) hist[existing]=rec; else hist.unshift(rec);
  saveHist(hist);
  renderHist();
  switchTab('hist');
}

function clearAllHist(){
  if(!confirm('全ての履歴を削除しますか？')) return;
  localStorage.removeItem(HKEY);renderHist();
}
function delMonth(label){
  const hist=loadHist().filter(x=>x.label!==label);
  saveHist(hist);renderHist();
}

function renderHist(){
  document.getElementById('mp2').textContent=document.getElementById('mp').textContent;
  const hist=loadHist();
  const el=document.getElementById('histList');
  if(!hist.length){el.innerHTML='<div class="hist-empty">まだ履歴がありません。<br>給与計算後に「保存」ボタンを押してください。</div>';document.getElementById('chartWrap').style.display='none';return;}
  document.getElementById('chartWrap').style.display='block';
  el.innerHTML=hist.map(r=>`
    <div class="hist-month">
      <div class="hist-month-label">${r.label} <button class="hist-del" onclick="delMonth('${r.label}')">削除</button></div>
      <table class="hist-table">
        ${r.entries.map(e=>`<tr><td>${e.name}</td><td>¥${fmt(e.total)}</td></tr>`).join('')}
        <tr class="total"><td>合計</td><td>¥${fmt(r.grand)}</td></tr>
      </table>
    </div>`).join('');
  drawChart(hist);
}

function drawChart(hist){
  const canvas=document.getElementById('myChart');
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.clientWidth-24,H=160;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);

  const data=[...hist].reverse();
  const vals=data.map(d=>d.grand);
  const max=Math.max(...vals)*1.15||1,min=0;
  const pad={t:10,r:10,b:30,l:60};
  const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;

  ctx.clearRect(0,0,W,H);

  // grid
  ctx.strokeStyle='rgba(0,0,0,.06)';ctx.lineWidth=1;
  [0,.25,.5,.75,1].forEach(f=>{
    const y=pad.t+cH*(1-f);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();
    ctx.fillStyle='#999892';ctx.font='9px sans-serif';ctx.textAlign='right';
    ctx.fillText((Math.round(max*f/10000)*10000/10000).toLocaleString()+'円',pad.l-4,y+3);
  });

  if(data.length===1){
    // single bar
    const x=pad.l+cW/2,barW=40;
    const bH=cH*(vals[0]/max);
    const y=pad.t+cH-bH;
    ctx.fillStyle='#B8965A';ctx.beginPath();ctx.roundRect(x-barW/2,y,barW,bH,4);ctx.fill();
    ctx.fillStyle='#5F5E5A';ctx.font='9px sans-serif';ctx.textAlign='center';
    ctx.fillText(data[0].label,x,H-8);
    return;
  }

  // line chart
  const pts=data.map((d,i)=>({x:pad.l+i*(cW/(data.length-1)),y:pad.t+cH*(1-d.grand/max)}));

  // area fill
  const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);
  grad.addColorStop(0,'rgba(184,150,90,.25)');grad.addColorStop(1,'rgba(184,150,90,.02)');
  ctx.beginPath();ctx.moveTo(pts[0].x,pad.t+cH);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(pts[pts.length-1].x,pad.t+cH);ctx.closePath();ctx.fillStyle=grad;ctx.fill();

  // line
  ctx.beginPath();ctx.strokeStyle='#B8965A';ctx.lineWidth=2;ctx.lineJoin='round';
  pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();

  // dots + labels
  pts.forEach((p,i)=>{
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle='#B8965A';ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#5F5E5A';ctx.font='9px sans-serif';ctx.textAlign='center';
    ctx.fillText(data[i].label,p.x,H-8);
  });
}

</script>
